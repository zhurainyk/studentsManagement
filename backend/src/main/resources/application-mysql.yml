# 【给前端同学】这是「可选配置档」，≈ 前端的 .env.production / .env.development。
# Spring 约定：application-{名字}.yml 是 profile 文件。默认不生效，
# 只有加了 -Dspring-boot.run.profiles=mysql 启动时，才会叠加/覆盖 application.yml 里的同名配置。
# 好处：换数据库只换配置，Java 代码一行都不用改。

# 注意：使用真 MySQL 时要按 README 先手工建库、执行 schema-mysql.sql 和 data.sql 一次。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/students?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # ↑ localhost:3306/students = 本机 3306 端口上的 students 库
    #   useUnicode / characterEncoding=utf8 → 中文不乱码
    #   serverTimezone=Asia/Shanghai → 时区对齐，避免时间字段差 8 小时
    #   allowPublicKeyRetrieval / useSSL → MySQL 8 驱动连接本地库的常见参数
    driver-class-name: com.mysql.cj.jdbc.Driver   # 换成 MySQL 驱动，对应 pom.xml 的 mysql-connector-java
    username: root                                # 数据库账号，按你本机实际情况改
    password: root                                # 数据库密码，按你本机实际情况改

  sql:
    init:
      mode: never   # ★ 关键差异：真数据库每次重启都重建表/重复插 10 条数据就出事了，
                    #   所以这里关闭自动初始化，改为人工只执行一次脚本。
                    #   对比 application.yml 里 H2 的 always（内存库随便重建，正好用来练习）。
